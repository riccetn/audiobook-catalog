name: Pages
# Writes the pages from templates/ and the API documentation into public/api/, and publishes public/ (the app and those docs)
# to GitHub Pages on every push to main. The docs are written only here, never kept in public/ in git.
# Needs Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci             # Liquid, which writes the pages, and TypeDoc, which writes the docs
      - run: make pages
      - run: make docs API_DOCS=public/api   # served at <site>/api/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
