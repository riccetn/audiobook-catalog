name: CI
# Push runs only on main, so a PR branch is tested once (by pull_request) rather than twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci             # TypeScript, the type checker, and ESLint
      - run: make check         # the tests, the type check and lint, as on your own machine
