name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make test          # builds first, then unit tests + browser smoke test
      - run: make validate
      - uses: actions/upload-artifact@v4
        with:
          name: audiobook-catalog
          path: dist/audiobook-catalog.html
