name: CI
# Push runs only on main, so a PR branch is tested once (by pull_request) rather than twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make test          # importers, command line, data checks, browser smoke test
      - run: make validate
