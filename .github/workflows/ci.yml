name: CI
# Push runs only on main, so a PR branch is tested once (by pull_request) rather than twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci             # Liquid for the pages, TypeScript, the type checker, ESLint and Prettier
      - run: make check         # the pages, the tests, the type check, lint and the format check, as on your own machine
      - run: make docs          # the API documentation, so a change that breaks it fails here rather than on publishing
