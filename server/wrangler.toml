# The app's server's Cloudflare settings (make deploy-server). See README.md.
# Its name stays the one from when it was only the catalog proxy, as it is the workers.dev address.
name = "audiobook-catalog-proxy"
main = "worker.ts"
compatibility_date = "2026-10-01"
# A workers.dev address (audiobook-catalog-proxy.<your subdomain>.workers.dev), no domain of your own needed.
workers_dev = true

# It serves the app too: a request for a file in public/ (written by make pages first) gets the file, without running
# the Worker or counting against its requests; anything else (/proxy/..., /sync, /ping) runs worker.js.
[assets]
directory = "../public"
# Every file at the address it is named by: by default Cloudflare redirects /books.html to /books, and Chrome refuses
# a redirected page from the service worker. The Worker answers / with index.html itself, through this binding.
binding = "ASSETS"
html_handling = "none"

[vars]
# The pages that may use the server: where the app is served, and make serve. Separate them with commas.
ALLOWED_ORIGINS = "https://riccetn.github.io, http://127.0.0.1:8000, http://localhost:8000"

# SERVER_KEY is a secret, never written here (the repo is public): npx wrangler secret put SERVER_KEY
# (a server set up before still has it as PROXY_KEY, which is read too)

# Syncing the catalog between devices (optional; docs/server.md, "Syncing devices") needs a D1 database bound
# as SYNC_DB. Its id is not written here: make deploy-server (deploy.mjs) finds it by name, makes it the first time,
# and deploys this file with the binding added, from the git-ignored wrangler.deploy.toml.
